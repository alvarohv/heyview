<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d73527"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8860b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#0f172a" flood-opacity="0.08"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="880" fill="#f8fafc"/>

  <!-- Title -->
  <text x="640" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Supplier Notification Automation — Notify All Suppliers</text>
  <text x="640" y="62" text-anchor="middle" font-size="13" fill="#64748b">Power Automate · SharePoint Online · Office 365 · Global Supply Chain Team</text>

  <!-- Phase labels -->
  <text x="80" y="110" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2">PHASE 1 · COLLECT</text>
  <text x="80" y="370" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2">PHASE 2 · MATCH</text>
  <text x="80" y="560" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2">PHASE 3 · NOTIFY · PER SUPPLIER</text>

  <!-- ============================ -->
  <!-- PHASE 1: Trigger + data pull -->
  <!-- ============================ -->

  <!-- Trigger -->
  <g filter="url(#shadow)">
    <rect x="80" y="130" width="170" height="70" rx="35" fill="#10b981"/>
    <text x="165" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">▶  Manual trigger</text>
    <text x="165" y="180" text-anchor="middle" font-size="11" fill="#d1fae5">Button (originally Fri recurrence)</text>
  </g>

  <!-- Data source: PO List -->
  <g filter="url(#shadow)">
    <rect x="320" y="130" width="200" height="100" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="320" y="130" width="200" height="28" rx="8" fill="#3b82f6"/>
    <text x="420" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">SHAREPOINT · PO LIST</text>
    <text x="420" y="178" text-anchor="middle" font-size="12" fill="#0f172a">Get_POs (filter)</text>
    <text x="420" y="196" text-anchor="middle" font-size="10" fill="#64748b">field_10 ≠ '' · field_26 ≤ today+7</text>
    <text x="420" y="210" text-anchor="middle" font-size="10" fill="#64748b">field_17 &gt; 0 · top 5000</text>
  </g>

  <!-- Data source: Supplier DB -->
  <g filter="url(#shadow)">
    <rect x="590" y="130" width="200" height="100" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="590" y="130" width="200" height="28" rx="8" fill="#3b82f6"/>
    <text x="690" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">SHAREPOINT · SUPPLIER DB</text>
    <text x="690" y="178" text-anchor="middle" font-size="12" fill="#0f172a">Get_Supplier_Database</text>
    <text x="690" y="196" text-anchor="middle" font-size="10" fill="#64748b">All rows · top 5000</text>
    <text x="690" y="210" text-anchor="middle" font-size="10" fill="#64748b">SupplierNumber · Title · Email</text>
  </g>

  <!-- Dedupe -->
  <g filter="url(#shadow)">
    <rect x="320" y="260" width="200" height="74" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="420" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Select_Suppliers</text>
    <text x="420" y="302" text-anchor="middle" font-size="10" fill="#64748b">project to {Number, Name}</text>
    <text x="420" y="320" text-anchor="middle" font-size="10" fill="#64748b">→ Unique_Suppliers (union)</text>
  </g>

  <!-- Arrows phase 1 -->
  <path d="M 250 165 L 318 165" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 520 180 L 588 180" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 420 230 L 420 258" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ============================ -->
  <!-- PHASE 2: Match emails        -->
  <!-- ============================ -->

  <g filter="url(#shadow)">
    <rect x="320" y="390" width="470" height="120" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="555" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Apply_to_each_Supplier_(Get_Email)</text>
    <line x1="340" y1="430" x2="770" y2="430" stroke="#e2e8f0"/>

    <rect x="340" y="442" width="135" height="56" rx="6" fill="#f1f5f9"/>
    <text x="407" y="463" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Filter_Supplier_</text>
    <text x="407" y="478" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Email_Address</text>
    <text x="407" y="492" text-anchor="middle" font-size="9" fill="#64748b">match SupplierNumber</text>

    <rect x="490" y="442" width="135" height="56" rx="6" fill="#f1f5f9"/>
    <text x="557" y="463" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Supplier</text>
    <text x="557" y="478" text-anchor="middle" font-size="10" fill="#64748b">{Number, Name,</text>
    <text x="557" y="492" text-anchor="middle" font-size="10" fill="#64748b">Email ‖ ''}</text>

    <rect x="640" y="442" width="135" height="56" rx="6" fill="#f1f5f9"/>
    <text x="707" y="463" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Append to</text>
    <text x="707" y="478" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Suppliers[]</text>

    <path d="M 475 470 L 488 470" stroke="#475569" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 625 470 L 638 470" stroke="#475569" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
  </g>

  <!-- Arrows down into phase 2 -->
  <path d="M 420 334 L 420 360 L 480 360 L 480 388" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 690 230 L 690 360 L 630 360 L 630 388" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ============================ -->
  <!-- PHASE 3: Per supplier        -->
  <!-- ============================ -->

  <g filter="url(#shadow)">
    <rect x="80" y="580" width="1120" height="270" rx="10" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="100" y="608" font-size="13" font-weight="700" fill="#0f172a">Apply_to_each_Final_Supplier  →  Check_If_Supplier_Has_Email</text>

    <!-- Email branch THEN -->
    <text x="100" y="630" font-size="10" fill="#64748b">if email present:</text>

    <!-- Filter step -->
    <rect x="100" y="640" width="160" height="60" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="180" y="662" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Filter_By_Supplier</text>
    <text x="180" y="678" text-anchor="middle" font-size="10" fill="#64748b">POs where</text>
    <text x="180" y="691" text-anchor="middle" font-size="10" fill="#64748b">field_4 == SupplierNumber</text>

    <!-- Past due -->
    <rect x="290" y="618" width="160" height="50" rx="6" fill="#fef2f2" stroke="#d73527" stroke-width="1.5"/>
    <text x="370" y="638" text-anchor="middle" font-size="11" font-weight="700" fill="#d73527">⚠ Past Due</text>
    <text x="370" y="654" text-anchor="middle" font-size="10" fill="#64748b">field_26 &lt; today</text>

    <rect x="290" y="684" width="160" height="50" rx="6" fill="#fffbeb" stroke="#b8860b" stroke-width="1.5"/>
    <text x="370" y="704" text-anchor="middle" font-size="11" font-weight="700" fill="#b8860b">📅 Due ≤ 7 days</text>
    <text x="370" y="720" text-anchor="middle" font-size="10" fill="#64748b">field_26 ≥ today</text>

    <!-- HTML tables -->
    <rect x="480" y="618" width="150" height="50" rx="6" fill="#fef2f2" stroke="#d73527" stroke-width="1"/>
    <text x="555" y="640" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Create Past Due</text>
    <text x="555" y="655" text-anchor="middle" font-size="10" fill="#64748b">HTML Table</text>

    <rect x="480" y="684" width="150" height="50" rx="6" fill="#fffbeb" stroke="#b8860b" stroke-width="1"/>
    <text x="555" y="706" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Create Upcoming</text>
    <text x="555" y="721" text-anchor="middle" font-size="10" fill="#64748b">HTML Table</text>

    <!-- Send email -->
    <rect x="660" y="650" width="180" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="750" y="673" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Send_an_email_(V2)</text>
    <text x="750" y="690" text-anchor="middle" font-size="10" fill="#64748b">Subject toggles URGENT</text>
    <text x="750" y="703" text-anchor="middle" font-size="10" fill="#64748b">Importance: High ‖ Normal</text>

    <!-- Update items -->
    <rect x="870" y="650" width="160" height="60" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="950" y="673" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Update PO items</text>
    <text x="950" y="690" text-anchor="middle" font-size="10" fill="#64748b">Status = 'Notified'</text>
    <text x="950" y="703" text-anchor="middle" font-size="10" fill="#64748b">field_3 = 'Yes'</text>

    <!-- Exception -->
    <rect x="1050" y="650" width="140" height="60" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="1120" y="673" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">Exception</text>
    <text x="1120" y="690" text-anchor="middle" font-size="10" fill="#64748b">on Send failure</text>
    <text x="1120" y="703" text-anchor="middle" font-size="10" fill="#64748b">→ admin email</text>

    <!-- Else branches -->
    <text x="100" y="765" font-size="10" fill="#64748b">if no email:</text>
    <rect x="100" y="775" width="220" height="38" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="210" y="792" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Missing_Email_Error_Log</text>
    <text x="210" y="805" text-anchor="middle" font-size="9" fill="#94a3b8">Compose only — not persisted to a list</text>

    <text x="360" y="765" font-size="10" fill="#64748b">if no POs after filter:</text>
    <rect x="360" y="775" width="220" height="38" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="470" y="792" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">No_POs_for_Supplier_Log</text>
    <text x="470" y="805" text-anchor="middle" font-size="9" fill="#94a3b8">Compose only</text>

    <!-- Internal arrows phase 3 -->
    <path d="M 260 670 L 286 643" stroke="#d73527" stroke-width="1.5" fill="none" marker-end="url(#arrow-red)"/>
    <path d="M 260 670 L 286 707" stroke="#b8860b" stroke-width="1.5" fill="none" marker-end="url(#arrow-amber)"/>
    <path d="M 450 643 L 478 643" stroke="#d73527" stroke-width="1.5" fill="none" marker-end="url(#arrow-red)"/>
    <path d="M 450 707 L 478 707" stroke="#b8860b" stroke-width="1.5" fill="none" marker-end="url(#arrow-amber)"/>
    <path d="M 630 643 L 660 670" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M 630 707 L 660 680" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M 840 680 L 868 680" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M 840 700 L 1050 700" stroke="#ea580c" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  </g>

  <!-- Connector from phase 2 to phase 3 -->
  <path d="M 555 510 L 555 540 L 555 560 L 180 560 L 180 640" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g transform="translate(940, 105)">
    <rect x="0" y="0" width="260" height="160" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#0f172a">LEGEND</text>

    <rect x="14" y="34" width="14" height="14" rx="2" fill="#10b981"/>
    <text x="36" y="46" font-size="11" fill="#334155">Trigger</text>

    <rect x="14" y="56" width="14" height="14" rx="2" fill="#3b82f6"/>
    <text x="36" y="68" font-size="11" fill="#334155">SharePoint data action</text>

    <rect x="14" y="78" width="14" height="14" rx="2" fill="#fff" stroke="#475569"/>
    <text x="36" y="90" font-size="11" fill="#334155">Logic / transformation</text>

    <rect x="14" y="100" width="14" height="14" rx="2" fill="#d73527"/>
    <text x="36" y="112" font-size="11" fill="#334155">Past-due branch</text>

    <rect x="14" y="122" width="14" height="14" rx="2" fill="#b8860b"/>
    <text x="36" y="134" font-size="11" fill="#334155">Upcoming (≤ 7 days) branch</text>

    <rect x="14" y="144" width="14" height="14" rx="2" fill="#fff7ed" stroke="#ea580c" stroke-dasharray="3 2"/>
    <text x="36" y="156" font-size="11" fill="#334155">Error / exception path</text>
  </g>
</svg>
