<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">

  <!-- Background -->
  <rect width="900" height="620" fill="#f8f9fb" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">KDF Connect — System Architecture</text>
  <text x="450" y="60" text-anchor="middle" font-size="12" fill="#6b7280">Field Workforce Management Platform · .NET Core · React · React Native · Azure</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- CLIENT LAYER label -->
  <text x="30" y="108" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="1.2">CLIENT LAYER</text>
  <line x1="30" y1="113" x2="870" y2="113" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Mobile App box -->
  <rect x="50" y="125" width="200" height="160" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="50" y="125" width="200" height="36" rx="10" fill="#3b82f6"/>
  <rect x="50" y="148" width="200" height="13" rx="0" fill="#3b82f6"/>
  <text x="150" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Mobile App (iPad / iOS)</text>
  <text x="150" y="164" text-anchor="middle" font-size="10" fill="#6b7280">React Native · Expo 44 · TypeScript</text>
  <text x="70" y="185" font-size="10" fill="#374151">• Daily timesheet + QR check-in/out</text>
  <text x="70" y="201" font-size="10" fill="#374151">• GPS route tracking (live map)</text>
  <text x="70" y="217" font-size="10" fill="#374151">• Geotagged photo capture</text>
  <text x="70" y="233" font-size="10" fill="#374151">• Weekly sign-off + digital signature</text>
  <text x="70" y="249" font-size="10" fill="#374151">• Offline-first (Redux queue flush)</text>
  <text x="70" y="266" font-size="10" fill="#6b7280" font-style="italic">Expo EAS Build (iOS + Android)</text>

  <!-- Admin Web box -->
  <rect x="340" y="125" width="220" height="160" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="340" y="125" width="220" height="36" rx="10" fill="#8b5cf6"/>
  <rect x="340" y="148" width="220" height="13" rx="0" fill="#8b5cf6"/>
  <text x="450" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Admin Web Dashboard</text>
  <text x="450" y="164" text-anchor="middle" font-size="10" fill="#6b7280">React 17 · TypeScript · Redux Toolkit · MUI</text>
  <text x="360" y="185" font-size="10" fill="#374151">• Timesheet management + approvals</text>
  <text x="360" y="201" font-size="10" fill="#374151">• Circuit map gallery (Google Maps)</text>
  <text x="360" y="217" font-size="10" fill="#374151">• Employee / project / job CRUD</text>
  <text x="360" y="233" font-size="10" fill="#374151">• Reports, CSV export, print views</text>
  <text x="360" y="249" font-size="10" fill="#374151">• QR code generation</text>
  <text x="360" y="266" font-size="10" fill="#6b7280" font-style="italic">Azure Static Web Apps</text>

  <!-- Design System box -->
  <rect x="650" y="125" width="200" height="160" rx="10" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
  <rect x="650" y="125" width="200" height="36" rx="10" fill="#10b981"/>
  <rect x="650" y="148" width="200" height="13" rx="0" fill="#10b981"/>
  <text x="750" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Design System</text>
  <text x="750" y="164" text-anchor="middle" font-size="10" fill="#6b7280">Pattern Lab 5 · Tailwind CSS · Handlebars</text>
  <text x="670" y="185" font-size="10" fill="#374151">• Atomic design methodology</text>
  <text x="670" y="201" font-size="10" fill="#374151">• Shared atoms, molecules, organisms</text>
  <text x="670" y="217" font-size="10" fill="#374151">• Single source of truth for UI</text>
  <text x="670" y="233" font-size="10" fill="#374151">• Gulp + PostCSS build pipeline</text>
  <text x="670" y="249" font-size="10" fill="#374151">• Line Awesome icon library</text>
  <text x="670" y="266" font-size="10" fill="#6b7280" font-style="italic">Firebase Hosting</text>

  <!-- Arrows down from clients to API -->
  <line x1="150" y1="285" x2="150" y2="330" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="450" y1="285" x2="450" y2="330" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- ─────────────────────────────────────────── -->
  <!-- API LAYER label -->
  <text x="30" y="322" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="1.2">API LAYER</text>
  <line x1="30" y1="327" x2="870" y2="327" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Backend API box -->
  <rect x="230" y="340" width="440" height="120" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="230" y="340" width="440" height="36" rx="10" fill="#f59e0b"/>
  <rect x="230" y="363" width="440" height="13" rx="0" fill="#f59e0b"/>
  <text x="450" y="363" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">REST API — ASP.NET Core 3.1</text>
  <text x="450" y="379" text-anchor="middle" font-size="10" fill="#6b7280">C# · Entity Framework Core · JWT Auth · Azure AD B2C · SignalR · Swagger</text>

  <text x="250" y="400" font-size="10" fill="#374151">• 28+ controllers: timesheets, GPS, images, employees, projects, reports</text>
  <text x="250" y="416" font-size="10" fill="#374151">• Custom fields system (3-tier: definition → measurement → job → value)</text>
  <text x="250" y="432" font-size="10" fill="#374151">• JWT access (50 min) + refresh tokens · SMTP email for auth flows</text>
  <text x="450" y="452" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">Azure App Service · Azure DevOps CI/CD</text>

  <!-- Arrows down from API to infra -->
  <line x1="350" y1="460" x2="260" y2="508" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="450" y1="460" x2="450" y2="508" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="550" y1="460" x2="640" y2="508" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- ─────────────────────────────────────────── -->
  <!-- INFRA LAYER label -->
  <text x="30" y="502" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="1.2">AZURE INFRASTRUCTURE</text>
  <line x1="30" y1="507" x2="870" y2="507" stroke="#e5e7eb" stroke-width="1"/>

  <!-- SQL Server -->
  <rect x="60" y="518" width="190" height="72" rx="8" fill="#fff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="155" y="537" text-anchor="middle" font-size="11" font-weight="600" fill="#ef4444">Azure SQL Server</text>
  <text x="155" y="554" text-anchor="middle" font-size="10" fill="#374151">SQL Server · EF Core</text>
  <text x="155" y="570" text-anchor="middle" font-size="10" fill="#374151">199+ migrations</text>
  <text x="155" y="583" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">kdf-timesheet.database.windows.net</text>

  <!-- Blob Storage -->
  <rect x="280" y="518" width="190" height="72" rx="8" fill="#fff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="375" y="537" text-anchor="middle" font-size="11" font-weight="600" fill="#ef4444">Azure Blob Storage</text>
  <text x="375" y="554" text-anchor="middle" font-size="10" fill="#374151">Geotagged photos</text>
  <text x="375" y="570" text-anchor="middle" font-size="10" fill="#374151">Employee signatures</text>
  <text x="375" y="583" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">CDN delivery</text>

  <!-- SignalR + Insights -->
  <rect x="500" y="518" width="310" height="72" rx="8" fill="#fff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="655" y="537" text-anchor="middle" font-size="11" font-weight="600" fill="#ef4444">Azure Services</text>
  <text x="655" y="554" text-anchor="middle" font-size="10" fill="#374151">SignalR (real-time) · AD B2C (auth)</text>
  <text x="655" y="570" text-anchor="middle" font-size="10" fill="#374151">Application Insights (monitoring)</text>
  <text x="655" y="583" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">DevOps CI/CD pipeline</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Auth label on mobile arrow -->
  <text x="102" y="316" font-size="9" fill="#3b82f6">JWT / RTK Query</text>
  <text x="395" y="316" font-size="9" fill="#8b5cf6">JWT / RTK Query</text>

</svg>
