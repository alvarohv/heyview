<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="script" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowG" markerWidth="11" markerHeight="11" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="60" y="68" fill="#f1f5f9" font-size="34" font-weight="700">Supply/Demand Planning Tool — Data Architecture</text>
  <text x="60" y="100" fill="#94a3b8" font-size="18">Five Excel source tabs, one Office Script, one SDA Details output — refreshed in ~25 seconds</text>
  <text x="60" y="138" fill="#64748b" font-size="13" font-weight="700" letter-spacing="1">SOURCE TABS</text>
  <g font-size="16" font-weight="600">
    <rect x="60" y="150" width="230" height="56" rx="10" fill="#1e293b" stroke="#334155"/><text x="80" y="184" fill="#e2e8f0">Demand Tracker</text>
    <rect x="60" y="225" width="230" height="56" rx="10" fill="#1e293b" stroke="#334155"/><text x="80" y="259" fill="#e2e8f0">FlatBOM Table</text>
    <rect x="60" y="300" width="230" height="56" rx="10" fill="#1e293b" stroke="#334155"/><text x="80" y="334" fill="#e2e8f0">Material Master</text>
    <rect x="60" y="375" width="230" height="56" rx="10" fill="#1e293b" stroke="#334155"/><text x="80" y="409" fill="#e2e8f0">Inventory Details</text>
    <rect x="60" y="450" width="230" height="56" rx="10" fill="#1e293b" stroke="#334155"/><text x="80" y="484" fill="#e2e8f0">Purchase Orders</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M290 178 C 360 178, 380 300, 455 312" marker-end="url(#arrow)"/>
    <path d="M290 253 C 360 253, 385 305, 455 322" marker-end="url(#arrow)"/>
    <path d="M290 328 L 450 328" marker-end="url(#arrow)"/>
    <path d="M290 403 C 360 403, 385 350, 455 338" marker-end="url(#arrow)"/>
    <path d="M290 478 C 360 478, 380 360, 455 348" marker-end="url(#arrow)"/>
  </g>
  <rect x="460" y="250" width="240" height="160" rx="16" fill="url(#script)"/>
  <text x="580" y="295" text-anchor="middle" fill="#04261c" font-size="20" font-weight="700">Office Script</text>
  <text x="580" y="320" text-anchor="middle" fill="#04261c" font-size="14" font-weight="600">TypeScript · Excel M365</text>
  <line x1="490" y1="338" x2="670" y2="338" stroke="#04261c" stroke-opacity="0.25" stroke-width="1"/>
  <text x="580" y="362" text-anchor="middle" fill="#04261c" font-size="15" font-weight="700">BOM Demand Explosion</text>
  <text x="580" y="386" text-anchor="middle" fill="#063d2c" font-size="13">FG demand to component demand</text>
  <path d="M700 330 L 820 330" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowG)"/>
  <rect x="825" y="200" width="315" height="260" rx="14" fill="#0b1424" stroke="#10b981" stroke-width="1.5"/>
  <text x="982" y="232" text-anchor="middle" fill="#10b981" font-size="18" font-weight="700">SDADetails Table</text>
  <rect x="850" y="250" width="265" height="24" fill="#16233b"/>
  <text x="860" y="267" fill="#94a3b8" font-size="12" font-weight="600">Item · KF · weeks (YYYYWW)</text>
  <g font-size="11" fill="#cbd5e1">
    <rect x="850" y="276" width="265" height="20" fill="#0e1a30"/><text x="860" y="290">BOH RM (Units)</text>
    <rect x="850" y="298" width="265" height="20" fill="#101d35"/><text x="860" y="312">Open Purchase Orders</text>
    <rect x="850" y="320" width="265" height="20" fill="#0e1a30"/><text x="860" y="334">Total PP Supply / Demand</text>
    <rect x="850" y="342" width="265" height="20" fill="#3a1212"/><text x="860" y="356" fill="#fca5a5">Projected EOH — negative = red</text>
    <rect x="850" y="364" width="265" height="20" fill="#101d35"/><text x="860" y="378">Projected WOH</text>
  </g>
  <text x="982" y="408" text-anchor="middle" fill="#64748b" font-size="12">12 Key Figures x 52 weeks per component</text>
  <text x="982" y="432" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">~1,800 components · 1.1M values</text>
  <text x="60" y="635" fill="#475569" font-size="14">Global Medical Device Manufacturer · Supply Chain Planning   ·   Office Scripts automation by Alvaro Hernandez</text>
</svg>
