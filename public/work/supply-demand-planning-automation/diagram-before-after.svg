<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <marker id="arr" markerWidth="14" markerHeight="14" refX="6" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <text x="60" y="70" fill="#f1f5f9" font-size="34" font-weight="700">From a manual five-tab process to a 25-second refresh</text>
  <text x="60" y="102" fill="#94a3b8" font-size="18">Supply/demand planning at a global medical device manufacturer — same Excel workbook, completely different workflow</text>
  <rect x="60" y="140" width="470" height="430" rx="16" fill="#160f12" stroke="#7f1d1d"/>
  <text x="85" y="182" fill="#f87171" font-size="22" font-weight="700">BEFORE — Manual</text>
  <text x="85" y="210" fill="#9ca3af" font-size="14">Planner assembles the view by hand, every week</text>
  <g font-size="15" fill="#e5e7eb">
    <circle cx="98" cy="248" r="4" fill="#ef4444"/><text x="115" y="253">Open &amp; cross-reference 5 separate tabs</text>
    <circle cx="98" cy="288" r="4" fill="#ef4444"/><text x="115" y="293">Explode BOM demand by hand</text>
    <circle cx="98" cy="328" r="4" fill="#ef4444"/><text x="115" y="333">Reconcile inventory buckets &amp; POs</text>
    <circle cx="98" cy="368" r="4" fill="#ef4444"/><text x="115" y="373">Manually compute EOH &amp; WOH</text>
    <circle cx="98" cy="408" r="4" fill="#ef4444"/><text x="115" y="413">Eyeball spreadsheet for shortfalls</text>
    <circle cx="98" cy="448" r="4" fill="#ef4444"/><text x="115" y="453">Repeat for the second site</text>
  </g>
  <line x1="85" y1="480" x2="505" y2="480" stroke="#7f1d1d" stroke-opacity="0.5"/>
  <text x="85" y="520" fill="#9ca3af" font-size="15">Time per refresh</text>
  <text x="85" y="552" fill="#f87171" font-size="26" font-weight="700">Hours · error-prone</text>
  <line x1="545" y1="355" x2="650" y2="355" stroke="#10b981" stroke-width="4" marker-end="url(#arr)"/>
  <rect x="670" y="140" width="470" height="430" rx="16" fill="#0a1a14" stroke="#065f46"/>
  <text x="695" y="182" fill="#34d399" font-size="22" font-weight="700">AFTER — One Script</text>
  <text x="695" y="210" fill="#9ca3af" font-size="14">One click regenerates the SDA Details tab</text>
  <g font-size="15" fill="#e5e7eb">
    <path d="M703 244 l5 5 l9 -11" stroke="#10b981" stroke-width="2.5" fill="none"/><text x="725" y="253">Reads all 5 tabs automatically</text>
    <path d="M703 284 l5 5 l9 -11" stroke="#10b981" stroke-width="2.5" fill="none"/><text x="725" y="293">BOM explosion in JavaScript</text>
    <path d="M703 324 l5 5 l9 -11" stroke="#10b981" stroke-width="2.5" fill="none"/><text x="725" y="333">52-week rolling projection</text>
    <path d="M703 364 l5 5 l9 -11" stroke="#10b981" stroke-width="2.5" fill="none"/><text x="725" y="373">Negative EOH auto-highlighted red</text>
    <path d="M703 404 l5 5 l9 -11" stroke="#10b981" stroke-width="2.5" fill="none"/><text x="725" y="413">1.1M values written, no formulas</text>
    <path d="M703 444 l5 5 l9 -11" stroke="#10b981" stroke-width="2.5" fill="none"/><text x="725" y="453">Both sites, one shared architecture</text>
  </g>
  <line x1="695" y1="480" x2="1115" y2="480" stroke="#065f46" stroke-opacity="0.6"/>
  <text x="695" y="520" fill="#9ca3af" font-size="15">Time per refresh</text>
  <text x="695" y="552" fill="#34d399" font-size="26" font-weight="700">~25 seconds · repeatable</text>
  <text x="60" y="635" fill="#475569" font-size="14">Office Scripts · Excel for Microsoft 365   ·   Global Medical Device Manufacturer, Supply Chain Planning</text>
</svg>
