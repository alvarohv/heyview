<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bgh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#13233f"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bgh)"/>
  <rect x="0" y="0" width="1080" height="10" fill="url(#acc)"/>
  <text x="80" y="130" fill="#10b981" font-size="22" font-weight="700" letter-spacing="3">CASE STUDY · OFFICE SCRIPTS AUTOMATION</text>
  <text x="80" y="195" fill="#f8fafc" font-size="50" font-weight="800">Supply/Demand Planning</text>
  <text x="80" y="252" fill="#cbd5e1" font-size="30" font-weight="500">Johnson &amp; Johnson MedTech · Excel for M365</text>
  <rect x="80" y="310" width="440" height="200" rx="18" fill="#16233b" stroke="#27384f"/>
  <text x="110" y="400" fill="url(#acc)" font-size="68" font-weight="800">~1,800</text>
  <text x="110" y="445" fill="#cbd5e1" font-size="24">components tracked</text>
  <text x="110" y="478" fill="#7c8aa0" font-size="19">across two manufacturing sites</text>
  <rect x="560" y="310" width="440" height="200" rx="18" fill="#16233b" stroke="#27384f"/>
  <text x="590" y="400" fill="url(#acc)" font-size="68" font-weight="800">~25 s</text>
  <text x="590" y="445" fill="#cbd5e1" font-size="24">per full refresh</text>
  <text x="590" y="478" fill="#7c8aa0" font-size="19">down from hours of manual work</text>
  <rect x="80" y="540" width="440" height="200" rx="18" fill="#16233b" stroke="#27384f"/>
  <text x="110" y="630" fill="url(#acc)" font-size="68" font-weight="800">1.1M</text>
  <text x="110" y="675" fill="#cbd5e1" font-size="24">cell values computed</text>
  <text x="110" y="708" fill="#7c8aa0" font-size="19">in JavaScript, no formula strings</text>
  <rect x="560" y="540" width="440" height="200" rx="18" fill="#16233b" stroke="#27384f"/>
  <text x="590" y="630" fill="url(#acc)" font-size="68" font-weight="800">5 to 1</text>
  <text x="590" y="675" fill="#cbd5e1" font-size="24">source tabs consolidated</text>
  <text x="590" y="708" fill="#7c8aa0" font-size="19">into one SDA Details table</text>
  <rect x="80" y="800" width="920" height="160" rx="18" fill="#0e1a30" stroke="#1e2d47"/>
  <text x="110" y="860" fill="#94a3b8" font-size="22">The constraint: it had to live inside Excel — no new infrastructure.</text>
  <text x="110" y="900" fill="#e2e8f0" font-size="24" font-weight="600">The win was architectural: move every computation into JavaScript,</text>
  <text x="110" y="934" fill="#e2e8f0" font-size="24" font-weight="600">write values only, beat the 5-minute Office Scripts timeout.</text>
  <text x="80" y="1025" fill="#475569" font-size="22">Alvaro Hernandez · Automation &amp; Tools Developer · Tojii / HeyView</text>
</svg>
